<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Skoki narciarskie w przeglądarce: trening, konkursy i Puchar Świata z rywalami komputerowymi, sterowanie myszą, klawiaturą albo dotykiem. Działa też bez sieci."
    />
    <!-- The preview a link to the game gets when shared. The picture is the README screenshot, taken from the
         repository so that the game itself does not carry it (e2e/readme-screenshot.shot.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Telemark" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:url" content="https://telemark.visvaya.workers.dev/" />
    <meta property="og:title" content="Telemark · skoki narciarskie w przeglądarce" />
    <meta
      property="og:description"
      content="Trening, konkursy i Puchar Świata z rywalami komputerowymi. Fizyka skoku przeniesiona z Deluxe Ski Jump 2."
    />
    <meta property="og:image" content="https://raw.githubusercontent.com/visvaya/telemark/master/docs/screenshot.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta
      property="og:image:alt"
      content="Skoczek w locie nad zeskokiem skoczni Ćwiczebna K90 o zmierzchu, w padającym śniegu; pikselowa grafika gry Telemark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telemark" />
    <!-- Marks the page of the regular build. The game registers its service worker only where this is present,
         so the single-file page, which has no such line, never does. -->
    <meta name="telemark-offline" content="service-worker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Telemark · skoki narciarskie w przeglądarce</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown only while the game has not started: it appears after a moment (src/ui/app.css) and the game
           replaces it. If a script of the game cannot be fetched, this is what is left instead of a blank page. -->
      <p class="boot-note">
        Telemark: wczytywanie gry. Jeśli ten napis nie znika, <a href="/">wczytaj stronę ponownie</a>.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
