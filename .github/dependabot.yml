# Weekly version updates, grouped per ecosystem, three days after a release, the
# same age pnpm-workspace.yaml requires. npm is not listed: npm versions are
# updated by hand for now.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /tools/re
      - /tools/font
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      python-tools:
        patterns: ["*"]
