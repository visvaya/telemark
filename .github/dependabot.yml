# Weekly version updates, grouped per ecosystem, seven days after a release: no
# shorter than the three days pnpm-workspace.yaml requires, and the minimum the
# zizmor dependabot-cooldown audit accepts. npm is not listed: npm versions are
# updated by hand for now.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /tools/re
      - /tools/font
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-tools:
        patterns: ["*"]
